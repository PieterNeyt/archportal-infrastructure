name: archPortal

services:

  checkers-postgres:
    image: postgres:17.1-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: checkersDb
    volumes:
      - ./postgres/checkers-data:/var/lib/postgresql/data
      - ./init-scripts/sql/checkers-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5445:5432"
    networks:
      - backend

  # PostgreSQL database
  app-postgres:
    image: postgres:17.6-alpine
    restart: always
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'postgres'
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5443:5432'
    networks:
      - backend
      - kdg-backend
    volumes:
      - ./postgresql/data:/var/lib/postgresql
      - ./init-scripts/sql/create-schemas.sql:/docker-entrypoint-initdb.d/init.sql

  # RabbitMQ
  app-rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: 'user'
      RABBITMQ_DEFAULT_PASS: 'password'
    ports:
      - '5672:5672'   # AMQP
      - '15672:15672' # Management UI
    networks:
      - backend
      - kdg-backend        # { added kdg-backend so services on that network can reach RabbitMQ }
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/log:/var/log/rabbitmq

  # Keycloak MySQL DB
  idp-mysql:
    image: mysql:9.0.1
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_DATABASE: 'keycloak'
      MYSQL_USER: 'keycloak'
      MYSQL_PASSWORD: 'password'
    ports:
      - '3307:3306'
    networks:
      - backend
    volumes:
      - ./idp_mysql_data:/var/lib/mysql

  # Keycloak
  idp-keycloak:
    image: quay.io/keycloak/keycloak:26.3
    environment:
      KEYCLOAK_ADMIN: 'admin'
      KEYCLOAK_ADMIN_PASSWORD: 'admin'
      KC_DB: 'mysql'
      KC_DB_URL_HOST: 'idp-mysql'
      KC_DB_URL_DATABASE: 'keycloak'
      KC_DB_USERNAME: 'keycloak'
      KC_DB_PASSWORD: 'password'
      KC_PROXY: 'edge'
      KC_HOSTNAME: 'localhost'
      KC_HTTP_RELATIVE_PATH: '/auth'
      KC_HOSTNAME_DEBUG: 'true'
    command:
      - start-dev
      - --import-realm
    ports:
      - '8180:8080'
    depends_on:
      - idp-mysql
    networks:
      - backend
    volumes:
      - ./keycloak/ArchPortal-export:/opt/keycloak/data/import


  # Redis (Boardgame cache & session store)
  # boardgame-redis:
  #   image: redis:7.2-alpine
  #   ports:
  #     - '6380:6379'
  #   networks:
  #     - backend
  #   volumes:
  #     - ./redis/data:/data

  game-postgres:
    image: postgres:17.1-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ttt
    networks:
      - backend
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./init-scripts/sql/ttt-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5444:5432"
  
  # Platform Backend
  platform-backend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team15/archportal/archportalbackend/backend:latest
    depends_on:
      - idp-keycloak
    networks:
      - backend
    ports:
      - '8089:8080'
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_MAIL_PASSWORD: roec zbxc douq fjdl
      SPRING_MAIL_USERNAME: archportalplatform@gmail.com
      SPRING_RABBITMQ_HOST: archportal-app-rabbitmq-1
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password

  # Platform Frontend
  platform-frontend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team15/archportal/archportalfrontend/frontend:latest
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - backend
    environment:
      VITE_KC_URL: http://localhost/auth

  # TicTacToe Backend
  tictactoe-backend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team15/games/tik-tak-toe/ttt-backend/backend:latest
    networks:
      - backend
    ports:
      - '8081:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://game-postgres:5432/ttt
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: prod
      LAUNCHER_API_URL: http://archportal-platform-backend-1:8080
      AI_SERVICE_URL: http://archportal-tictactoe-ai-1:8000/ai-player/move
      SPRING_RABBITMQ_HOST: archportal-app-rabbitmq-1
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password

  # TicTacToe Frontend
  tictactoe-frontend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team15/games/tik-tak-toe/ttt-frontend/frontend:latest
    networks:
      - backend
    depends_on:
      - tictactoe-backend

  #   TicTacToe ai
  tictactoe-ai:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team3/ai-player
    networks:
      - backend
    ports:
      - "3334:8000"


  # # Checkers Backend
  checkers-backend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team15/games/checkers/checkers-backend/backend:latest
    restart: always
    depends_on:
      - checkers-postgres
      - app-rabbitmq
    networks:
      - backend
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://checkers-postgres:5432/checkersDb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: prod
      LAUNCHER_API_URL: http://archportal-platform-backend-1:8080



  # # Checkers Frontend
  checkers-frontend:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team15/games/checkers/checkers-frontend/frontend:latest
    restart: always
    depends_on:
      - checkers-backend
    ports:
      - "3000:80"
    networks:
      - backend



  # # Anti Corruption Layer
  # anticorruptionlayer:
  #   image: alpine:3.20 # TODO: replace with ACL image
  #   networks:
  #     - backend
  #   depends_on:
  #     - platform_backend
  #     - tictactoe_backend
  #     - checkers_backend

  nginx:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped

    ports:
      # These ports are in format <host-port>:<container-port>
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81' # Admin Web Port
      # Add any other Stream port you want to expose
      # - '21:21' # FTP

    environment:
      TZ: "Europe/Brussels"

      # Uncomment this if you want to change the location of
      # the SQLite DB file within the container
      # DB_SQLITE_FILE: "/data/database.sqlite"

      # Uncomment this if IPv6 is not enabled on your host
      # DISABLE_IPV6: 'true'

    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - backend

  app_chessgame_front:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/demo-content/chessgame/front:latest
    ports:
      - '3333:80'
    networks:
      - kdg-backend
    depends_on:
      - app_chessgame_back
      - app-rabbitmq       # { fixed service name (hyphen) }
      - chess_postgres

  app_chessgame_back:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/demo-content/chessgame/back:latest
    ports:
      - '8080:8080'
    networks:
      - kdg-backend
    depends_on:
      - chess_postgres
      - app-rabbitmq
    environment:
      - GAME_REGISTRATION_ID=8496c496-a884-48ed-9bb3-7c3aa50fb8ca
      - DATASOURCE_URL=jdbc:postgresql://app-postgres:5432/postgres
      - DATASOURCE_USER=user
      - DATASOURCE_PASSWORD=password
      - RABBIT_HOST=app-rabbitmq
      - RABBIT_PORT=5672
      - RABBIT_USER=user
      - RABBIT_PASSWORD=password
    deploy:
      resources:
        limits:
          memory: 768M


  chess_postgres:
    image: postgres:17.6-alpine
    restart: always
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'postgres'
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5455:5432'
    networks:
      - kdg-backend
    volumes:
      - ./postgresql/data:/var/lib/postgresql
      - ./init-scripts/sql:/docker-entrypoint-initdb.d

  chatbot-db:
    image: postgres:15
    container_name: ai_chatbot_db
    restart: always
    environment:
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: aipassword
      POSTGRES_DB: aichatbot
    ports:
      - "6432:5432"
    volumes:
      - ./postgres/chatbot:/var/lib/postgresql/data
      - ./init-scripts/sql/chatbot-init.sql:/docker-entrypoint-initdb.d/init.sql


  chatbot-ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama

  chatbot-fastapi:
    image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team3/ai-chatbot:latest
    container_name: ai_chatbot_service
    restart: always
    depends_on:
      - chatbot-db
      - chatbot-ollama
    environment:
      DATABASE_URL: postgresql+psycopg2://aiuser:aipassword@chatbot-db:5432/aichatbot
      OLLAMA_BASE_URL: http://ollama:11434
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "3335:8000"

networks:
  kdg-backend:
    name: kdg-back-network
    driver: bridge
  # kc:
  #   name: kc-network
  #   driver: bridge
  backend:
    name: back-network
    driver: bridge
